<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fit Live Simulator</title>
<style>
body {font-family:system-ui,sans-serif;background:#0d1117;color:#e6edf3;padding:1rem;max-width:480px;margin:auto;}
h1 {font-size:1.5rem;color:#58a6ff;}
.card {background:#161b22;border:1px solid #30363d;border-radius:12px;padding:1rem;margin:1rem 0;}
.value {font-size:2rem;font-weight:bold;color:#3fb950;}
.btn {display:inline-block;padding:0.6rem 1.2rem;background:#238636;color:#fff;border:none;border-radius:8px;margin:0.2rem;font-size:1rem;}
.btn:hover {background:#2ea043;}
.status {font-size:0.9rem;color:#8b949e;margin-top:0.2rem;}
</style>
</head>
<body>
<h1>🚴 Fit Live Simulator</h1>
<div class="card">
  <div>Vitesse</div>
  <div class="value" id="speed">--</div>
  <div class="status">km/h</div>
</div>
<div class="card">
  <div>Cadence</div>
  <div class="value" id="cadence">--</div>
  <div class="status">tr/min</div>
</div>
<div class="card">
  <div>Pignon actuel</div>
  <div class="value" id="cog">5 (17T)</div>
  <div class="status">Contrôleur auto</div>
</div>
<div class="card">
  <h3>Simulation parcours</h3>
  <p style="font-size:0.85rem;color:#8b949e">Profil 5min chargé. Pente calculée en live depuis <code>course/profile.json</code>.</p>
</div>
<div class="card">
  <h3>Contrôle manuel (Test)</h3>
  <button class="btn" onclick="sendCog(4)">⬇ 15T</button>
  <button class="btn" onclick="sendCog(5)">17T (défaut)</button>
  <button class="btn" onclick="sendCog(6)">⬆ 19T</button>
</div>

<script>
const ws = new WebSocket(`ws://${location.host}/ws`);
ws.onmessage = (e) => {
  const d = JSON.parse(e.data);
  document.getElementById('speed').textContent = d.speed_kmh?.toFixed(1) || '--';
  document.getElementById('cadence').textContent = d.cadence_rpm?.toFixed(0) || '--';
  document.getElementById('cog').textContent = d.current_cog + ' (index)';
};
function sendCog(index) {
  ws.send(JSON.stringify({current_cog: index}));
}
</script>
</body>
</html>
